name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ai:
    name: knoverse-ai (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knoverse-ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check app.py config.py chat_ai.py ollama_models.py pinecone_file_upload.py pinecone_file_delete.py tests
      - run: uv run pytest -q

  web:
    name: knoverse-sys (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: knoverse-sys
    env:
      # Placeholders so the build can evaluate modules; nothing is contacted at build time.
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_OR_ANON_KEY: ci-placeholder
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: knoverse-sys/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
